<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Approvals</title>

<style>
  :root{--ink:#0B0F0D;--mint:#00E187;--mint-d:#00C877;--line:#E3E8E5;--soft:#F1F4F2;--muted:#4F5753;--body:#2A302D;--chip:#E6FCF2;--chip-t:#00663D;--red:#B42318}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Geist,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fff;
    background-image:linear-gradient(var(--soft) 1px,transparent 1px),linear-gradient(90deg,var(--soft) 1px,transparent 1px);background-size:48px 48px;background-attachment:fixed}
  .wrap{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;min-height:100%}
  button{font-family:inherit;color:inherit}
  .hdr{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
  .brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:-.2px}
  .brand .dot{color:var(--mint-d)}
  .iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .iconbtn .pip{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--mint);border:2px solid #fff}
  .spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  .tabs{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin-top:-4px}
  .tab{flex:1;height:44px;border:none;border-radius:999px;background:transparent;color:var(--body);font-size:14px;font-weight:600;cursor:pointer}
  .tab[aria-selected=true]{background:var(--ink);color:#fff;font-weight:700}
  .tab .n{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:999px;background:var(--mint);color:var(--ink);font-size:12px;font-weight:700;margin-left:6px;padding:0 6px}
  .hero{display:flex;flex-direction:column;gap:6px;padding:0 4px}
  .eyebrow{font-size:14px;color:var(--muted)}
  h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
  .lead{font-size:18px;font-weight:600;line-height:1.35}
  .hl{background:var(--mint);border-radius:6px;padding:0 6px}
  .stats{display:flex;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(11,15,13,.06)}
  .stat{flex:1;padding:12px 8px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border-right:none}
  .stat .k{font-size:11px;color:var(--muted)}.stat .v{font-size:20px;font-weight:700}
  .list{display:flex;flex-direction:column;gap:12px}
  .card{display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;width:100%}
  .card:first-child{border-color:var(--ink)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .chip{font-size:12px;font-weight:600;background:var(--chip);color:var(--chip-t);border-radius:999px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
  .chip.new{background:var(--ink);color:#fff}
  .time{font-size:12px;color:var(--muted)}
  .subj{font-size:17px;font-weight:700}
  .from{font-size:13px;color:var(--muted);word-break:break-all}
  .prev{font-size:14px;line-height:1.4;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
  .empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
  .notice{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.4}
  .notice b{color:var(--mint)}
  /* review */
  .top{display:flex;align-items:center;gap:12px}
  .rt{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:0;line-height:1.1;word-break:break-word}
  details{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#F7F9F8}
  summary{font-size:13px;font-weight:600;cursor:pointer}
  details .orig{font-size:14px;color:var(--body);margin-top:8px;line-height:1.45;white-space:pre-wrap;max-height:40vh;overflow:auto}
  .lbl{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
  .lbl span{font-weight:500;color:var(--muted)}
  .ph{font-size:12px;font-weight:600;background:var(--mint);border-radius:6px;padding:2px 8px}
  textarea{width:100%;min-height:46vh;resize:vertical;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);border:1.5px solid var(--ink);border-radius:16px;padding:14px;background:#fff}
  .hint{font-size:12px;color:var(--muted)}
  .actions{display:flex;gap:10px;position:sticky;bottom:calc(12px + env(safe-area-inset-bottom))}
  .btn{height:54px;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.rej{flex:1;border:1.5px solid var(--ink);background:#fff}
  .btn.ok{flex:2;border:none;background:var(--mint)}
  .btn:disabled{opacity:.5}
  /* sheet + toast + lock */
  .sheet{position:fixed;inset:0;background:rgba(11,15,13,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet .box{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .sheet h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px}
  .sheet p{margin:0;color:var(--body);font-size:15px;line-height:1.45}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-size:14px;font-weight:600;z-index:30;display:flex;gap:8px;align-items:center;max-width:92vw}
  .toast i{width:10px;height:10px;border-radius:50%;background:var(--mint);display:inline-block}
  .lock{display:flex;flex-direction:column;gap:16px;margin-top:8vh}
  .lock input{height:58px;border:1.5px solid var(--ink);border-radius:16px;font-size:24px;letter-spacing:8px;text-align:center;font-family:inherit}
  .err{color:var(--red);font-size:14px;min-height:20px}
  .hidden{display:none!important}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .nav .in{max-width:480px;margin:0 auto;display:flex}
  .nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer;position:relative;font-family:inherit}
  .nav button[aria-current=true]{color:var(--ink)}
  .nav button[aria-current=true] .ic{background:var(--mint)}
  .nav .ic{width:44px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .nav .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:999px;background:var(--ink);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
  .nav .dot.red{background:#E5484D}
  .stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .stg{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .stg b{display:inline-block;min-width:18px;margin-left:6px;border-radius:999px;background:var(--soft);font-size:11px;line-height:18px;padding:0 5px}
  .stg[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stg[aria-pressed=true] b{background:var(--mint);color:var(--ink)}
  .lcard{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px}
  .lcard .nm{font-size:17px;font-weight:700}
  .lcard .sub{font-size:13px;color:var(--muted);word-break:break-all}
  .lcard .note{font-size:13px;color:var(--body);line-height:1.4;white-space:pre-wrap}
  .lacts{display:flex;gap:8px;margin-top:4px}
  .lacts a,.lacts button{height:40px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;text-decoration:none;color:var(--ink);cursor:pointer;font-family:inherit}
  .lacts .go{flex:1;background:var(--mint);border-color:var(--mint)}
  .src{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--chip);color:var(--chip-t)}
  .sug{display:flex;align-items:center;gap:10px;background:#F7F9F8;border:1px dashed var(--line);border-radius:16px;padding:12px 14px}
  .sug .who{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sug .who small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .sug button{height:36px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:0 12px;cursor:pointer;font-family:inherit;flex:none}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
  .fld input,.fld textarea,.fld select{font:inherit;font-size:16px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:0}
  .fld textarea{min-height:80px;resize:vertical}
  .stgpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stgpick button{height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .stgpick button[aria-pressed=true]{border-color:var(--ink);background:var(--mint)}
  .fab{white-space:nowrap;position:fixed;right:calc(50% - 224px);bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:28px;line-height:56px;box-shadow:0 8px 24px rgba(11,15,13,.25);cursor:pointer;z-index:14}
  @media (max-width:480px){.fab{right:16px}}
  .callrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 16px}
  .callrow .who{flex:1;min-width:0}
  .callrow .num{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .callrow .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .callbtn{width:48px;height:48px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
  .tag{font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
  .tag.miss{background:#FDECEC;color:#B42318}.tag.newc{background:var(--ink);color:var(--mint)}.tag.out{background:var(--chip);color:var(--chip-t)}

  .ibtns{display:flex;gap:8px;margin-top:4px}
  .ibtns .btn{height:44px;font-size:14px;flex:1}
  .mail{font-size:14px;line-height:1.4;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .hchip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:8px 4px -4px}
  .st{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px}
  .st.Sent{background:var(--mint);color:var(--ink)}.st.FYI{background:var(--ink);color:var(--mint)}.st.Rejected{background:#FDECEC;color:#B42318}.st.Waiting{background:var(--chip);color:var(--chip-t)}
  .hbtns{display:flex;gap:8px}
  .sec{font-size:13px;font-weight:700;margin:6px 4px -4px;display:flex;justify-content:space-between;align-items:center}
  .sec span{font-weight:500;color:var(--muted)}
  .card.fyi{background:#F7F9F8;cursor:pointer}
  .card.fyi:first-child{border-color:var(--line)}
  .fyitag{font-size:11px;font-weight:700;background:var(--ink);color:var(--mint);border-radius:6px;padding:2px 8px}
  .btn.fyi{flex:1;border:1.5px solid var(--ink);background:#fff}
  .actions.two{position:static}
  .links{display:flex;flex-direction:column;gap:10px}
  .fab{white-space:nowrap;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;border:none;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:12px 16px;box-shadow:0 6px 20px rgba(11,15,13,.25);cursor:pointer}
  .fab span{color:var(--mint)}
  .chat{display:flex;flex-direction:column;gap:10px;padding-bottom:90px}
  .cb{max-width:85%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.45;word-wrap:break-word}
  .cb.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
  .cb.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}

  .cin{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);max-width:480px;margin:0 auto;z-index:16}
  .cin textarea{min-height:0;height:48px;flex:1;resize:none;border:1px solid var(--line);border-radius:18px;padding:12px 14px;font:inherit;font-size:16px;max-height:140px}
  .cin .btn{width:52px;padding:0;flex:none}

  .bopts{display:flex;flex-wrap:wrap;gap:8px}
  .bopt{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
  .bopt[aria-pressed=true]{background:var(--mint);border-color:var(--ink)}
  .btn[disabled]{opacity:.5}
  .xg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .xg>div{background:#F6F7F6;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .xg small{font-size:11px;color:var(--muted);font-weight:600}
  .xg b{font-size:15px}
  .xg span{font-size:11px;color:var(--muted)}
  .xg.tot>div{background:#fff;border:1px solid var(--line)}
  .nav button{font-size:10.5px}
  .nav .ic{width:40px}
  .link{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:600}
  .link small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
  .folder{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;margin-top:8px}
</style>
</head>

/* ---------- crypto: unlock the private flow link with the passcode ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decryptEndpoint(pass) {
  const { salt, iv, data } = CONFIG.ENDPOINT_ENC;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(salt), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(iv) }, key, b64(data));
  return new TextDecoder().decode(plain);
}

// The Outlook signature (added automatically when a reply is sent) already says "Kind regards, Brad",
// so strip a sign-off from the end of Claude's draft to avoid it appearing twice.
function stripSignoff(t) {
  return String(t || '').replace(/\s*\n\s*(kind regards|warm regards|best regards|regards|many thanks|thanks|thank you|cheers|best)[,!.]?\s*(\n\s*brad( milovic)?\.?)?\s*$/i, '').replace(/\s+$/, '');
}

function normalise(x) {
  const folder = x.client || x.ClientName || '';
  return { folder,
    id: x.id || x.MessageId, business: x.business || x.Business || 'Easy Books',
    client: (x.client || x.ClientName || '').replace(/^_?New Clients\/.*/i, 'New client') || 'Client',
    from: x.from || x.FromEmail || '', subject: x.subject || x.Subject || '(no subject)',
    receivedAt: x.receivedAt || x.ReceivedAt || '', clientEmail: x.clientEmail || x.ClientEmail || '',
    draft: stripSignoff(x.draft || x.Draft || ''), status: x.status || x.Status || 'Waiting', actionedAt: x.actionedAt || x.ActionedAt || ''
  };
}

/* ---------- Xero bills: forward supplier emails to a client's Xero bills inbox ---------- */
let BILLS_BASE = null;
async function billsBase() {
  if (BILLS_BASE) return BILLS_BASE;
  if (state.demo || !CONFIG.BILLS_ENC) return (BILLS_BASE = { 'Avalon Village Meats': 'bills.demo@xerofiles.com' });
  try {
    const { salt, iv, data } = CONFIG.BILLS_ENC;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(state.endpoint), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(salt), iterations: 100000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    BILLS_BASE = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(iv) }, key, b64(data))));
  } catch { BILLS_BASE = {}; }
  return BILLS_BASE;
}
const myBills = () => { try { return JSON.parse(store.get('bills') || '{}'); } catch { return {}; } };
const supplierMap = () => { try { return JSON.parse(store.get('supplierClient') || '{}'); } catch { return {}; } };
async function billsSheet(msg, onDone) {
  const all = { ...(await billsBase()), ...myBills() };
  const names = Object.keys(all).sort();
  const guess = supplierMap()[String(msg.from || '').toLowerCase()];
  const s = document.createElement('div'); s.className = 'sheet';
  const opts = names.map((n) => `<button class="bopt" data-n="${esc(n)}" aria-pressed="${n === guess}">${esc(n)}</button>`).join('');
  s.innerHTML = `<div class="box"><h2>Send to Xero bills</h2>
    <p>Forwards “${esc(msg.subject)}” and its attachments to the client's Xero. It shows up there as a draft bill.</p>
    <div class="bopts">${opts || '<p>No clients set up yet.</p>'}</div>
    <details><summary style="font-weight:700;cursor:pointer">Add another client</summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <input id="bn" placeholder="Client name" style="padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit">
        <input id="be" placeholder="Xero bills email (…@xerofiles.com)" style="padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit">
        <div class="hint">In Xero: Bills → New bill ▾ → Copy your forwarding email address.</div>
        <button class="btn fyi" id="badd">Save client</button>
      </div></details>
    <div class="actions" style="position:static"><button class="btn rej" data-x>Cancel</button><button class="btn ok" data-ok ${guess ? '' : 'disabled'}>Send to Xero</button></div></div>`;
  let pick = guess || '';
  const ok = s.querySelector('[data-ok]');
  s.querySelectorAll('.bopt').forEach((b) => b.onclick = () => { pick = b.dataset.n; s.querySelectorAll('.bopt').forEach((x) => x.setAttribute('aria-pressed', x === b)); ok.disabled = false; });
  s.querySelector('#badd').onclick = () => {
    const n = s.querySelector('#bn').value.trim(), e = s.querySelector('#be').value.trim().toLowerCase();
    if (!n || !/^[^@\s]+@xerofiles\.com$/.test(e)) { toast('Enter a name and a …@xerofiles.com address'); return; }
    const m = myBills(); m[n] = e; store.set('bills', JSON.stringify(m)); s.remove(); billsSheet(msg, onDone); toast('Saved ' + n);
  };
  s.addEventListener('click', (e) => { if (e.target === s || e.target.closest('[data-x]')) s.remove(); });
  ok.onclick = async () => {
    if (!pick) return; ok.disabled = true; ok.textContent = 'Sending…';
    try {
      await api({ action: 'tobills', id: msg.id, to: all[pick] });
      const sm = supplierMap(); sm[String(msg.from || '').toLowerCase()] = pick; store.set('supplierClient', JSON.stringify(sm));
      s.remove(); toast('Sent to ' + pick + ' in Xero bills'); if (onDone) onDone();
    } catch { ok.disabled = false; ok.textContent = 'Send to Xero'; toast('Couldn\'t forward it, try again'); }
  };
  document.body.appendChild(s);
}


/* ---------- Ask Claude: a chat inside the app ---------- */
const chatLog = () => { try { return JSON.parse(store.get('chat') || '[]'); } catch { return []; } };
const chatSave = (l) => store.set('chat', JSON.stringify(l.slice(-40)));
function chatContext() {
  return {
    business: state.biz,
    approvalsWaiting: state.items.filter((i) => i.status === 'Waiting').slice(0, 15).map((i) => ({ client: i.client, from: i.from, subject: i.subject, business: i.business })),
    inbox: inboxOpen().slice(0, 15).map((m) => ({ from: m.from, subject: m.subject, preview: m.preview.slice(0, 160) })),
    openLeads: state.leads.filter((l) => OPEN.includes(l.Stage)).slice(0, 20).map((l) => ({ name: l.Name, stage: l.Stage, business: l.Business, notes: l.Notes })),
    xeroClients: state.xero ? state.xero.list : [],
    callsToday: state.calls.filter((c) => isToday(c.at)).map((c) => ({ number: prettyNum(otherParty(c)), direction: c.dir, answered: c.answered }))
  };
}
const fmtChat = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function viewChat() {
  const log = chatLog();
  const bubbles = log.map((m) => `<div class="cb ${m.role === 'user' ? 'me' : 'ai'}">${fmtChat(m.content)}</div>`).join('');
  return `<div class="top"><button class="iconbtn" id="back" aria-label="Back">${I.back}</button><div class="eyebrow">[ Ask Claude ]</div>${log.length ? '<button class="iconbtn" id="clear" aria-label="Clear chat" style="font-size:12px;font-weight:700;width:auto;padding:0 12px">Clear</button>' : ''}</div>
    <div class="hero"><h1>ASK</h1><div class="lead">Type anything, <span class="hl">Claude helps</span></div></div>
    <div class="chat" id="chat">${bubbles || `<div class="hint">Ask about your clients, emails, leads or Xero figures, or get help drafting something.<br><br>Try: “Who owes the most in Xero?” · “Draft a BAS reminder for Zephyr” · “What's waiting on me today?”</div>`}${state.chatBusy ? '<div class="cb ai typing">Claude is thinking…</div>' : ''}</div>
    <div class="cin"><textarea id="q" rows="1" placeholder="Message Claude…"></textarea><button class="btn ok" id="ask" ${state.chatBusy ? 'disabled' : ''}>${I.send}</button></div>`;
}
function bindChat() {
  $('#back').onclick = () => { state.view = null; render(); };
  const c = $('#clear'); if (c) c.onclick = () => { chatSave([]); render(); };
  const q = $('#q'); const ch = $('#chat'); ch.scrollIntoView({ block: 'end' }); window.scrollTo(0, document.body.scrollHeight);
  q.oninput = () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; };
  const go = async () => {
    const text = q.value.trim(); if (!text || state.chatBusy) return;
    const log = chatLog(); log.push({ role: 'user', content: text }); chatSave(log); q.value = '';
    state.chatBusy = true; render();
    try {
      const r = state.demo ? { answer: 'This is the demo. In the live app I answer using your real emails, leads and Xero figures.' } : await api({ action: 'ask', messages: log.slice(-12), context: chatContext() });
      const a = (r && r.answer) || 'Sorry, I didn\'t get an answer back. Try again in a moment.';
      const l2 = chatLog(); l2.push({ role: 'assistant', content: a }); chatSave(l2);
    } catch { const l2 = chatLog(); l2.push({ role: 'assistant', content: 'I couldn\'t connect just now. Check your signal and try again.' }); chatSave(l2); }
    state.chatBusy = false; if (state.view === 'chat') render();
  };
  $('#ask').onclick = go;
  q.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } };
  if (!state.chatBusy) q.focus();
}

/* ---------- render + events ---------- */
function renderNav(show) {
  let n = document.getElementById('nav');
  if (!show) { if (n) n.remove(); const f = document.getElementById('fab'); if (f) f.remove(); return; }
  if (!n) { n = document.createElement('nav'); n.id = 'nav'; n.className = 'nav'; document.body.appendChild(n); }
  const cur = state.files ? 'files' : (state.view || 'home');
  const nIn = inboxOpen().filter((m) => !m.read).length, nMiss = missedToday().length, nW = waiting(state.biz).length, nSug = (() => { const b = state.biz; let t = 0; for (const x of CONFIG.BUSINESSES) { state.biz = x.id; t += suggestions().length; } state.biz = b; return t; })();
  const tab = (k, label, icon, badge, red) => `<button data-nav="${k}" aria-current="${cur === k}"><span class="ic">${icon}</span>${label}${badge ? `<span class="dot ${red ? 'red' : ''}">${badge}</span>` : ''}</button>`;
  n.innerHTML = `<div class="in">${tab('home', 'Approvals', I.check, nW)}${tab('inbox', 'Inbox', I.mail, nIn)}${tab('calls', 'Calls', I.phone, nMiss, true)}${tab('pipeline', 'Pipeline', I.board, nSug)}${tab('clients', 'Xero', I.xero, (state.xero ? state.xero.list.filter((c) => c.overdue > 0).length : 0), true)}${tab('files', 'Files', I.cloud, 0)}</div>`;
  let fab = document.getElementById('fab');
  if (!fab) { fab = document.createElement('button'); fab.id = 'fab'; fab.className = 'fab'; fab.setAttribute('aria-label', 'Ask Claude'); fab.innerHTML = '<span>✦</span> Ask Claude'; document.body.appendChild(fab); }
  fab.onclick = () => { state.open = null; state.hist = null; state.files = false; state.view = 'chat'; render(); };
  n.querySelectorAll('[data-nav]').forEach((b) => b.onclick = () => {
    const k = b.dataset.nav; state.open = null; state.hist = null; state.files = k === 'files'; state.view = (k === 'home' || k === 'files') ? null : k; render(); scrollTo(0, 0);
  });
}

function render() {
  const app = $('#app');
  if (!state.demo && !state.endpoint) { renderNav(false); app.innerHTML = viewLock(); bindLock(); return; }
  renderNav(!state.open);
  const it = state.open && state.items.find((i) => i.id === state.open);
  const back = () => { state.open = null; render(); };
  if (state.view === 'inbox' && !it) { app.innerHTML = viewInbox(); bindInbox(); return; }
  if (state.view === 'calls' && !it) { app.innerHTML = viewCalls(); bindCalls(); return; }
  if (state.view === 'pipeline' && !it) { app.innerHTML = viewPipeline(); bindPipeline(); return; }
  if (state.view === 'clients' && !it) { app.innerHTML = viewClients(); bindClients(); return; }
  if (state.view === 'chat' && !it) { const old = $('#q') ? $('#q').value : ''; renderNav(false); app.innerHTML = viewChat(); if (old) $('#q').value = old; bindChat(); return; }
  if (it && (it.status === 'Sent' || it.status === 'Rejected')) { app.innerHTML = viewDone(it); $('#back').onclick = back; const r = $('#reopen'); if (r) r.onclick = () => { it.status = 'Waiting'; render(); }; return; }
  if (state.hist && !it) { app.innerHTML = viewHistory(); $('#back').onclick = () => { state.hist = null; render(); };
    document.querySelectorAll('.hchip').forEach((c) => c.onclick = () => { state.hist = c.dataset.f; render(); });
    document.querySelectorAll('.card').forEach((c) => c.onclick = () => { state.open = c.dataset.id; render(); scrollTo(0, 0); }); return; }
  if (state.files && !it) { app.innerHTML = viewFiles(); $('#back').onclick = () => { state.files = false; render(); }; return; }
  if (it && it.status === 'FYI') { app.innerHTML = viewFyi(it); $('#back').onclick = () => { state.open = null; render(); }; $('#reopen').onclick = () => { it.status = 'Waiting'; render(); }; return; }
  app.innerHTML = it ? viewReview(it) : viewList();
  it ? bindReview(it) : bindList();
}

function bindLock() {
  const go = async () => {
    const p = $('#pass').value.trim().toLowerCase(); if (!p) return;
    $('#err').textContent = 'Checking…';
    try { state.endpoint = await decryptEndpoint(p); store.set('endpoint', state.endpoint); load(); }
    catch { $('#err').textContent = 'That passcode isn\'t right. Try again.'; }
  };
  $('#unlock').onclick = go; $('#pass').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  $('#pass').focus();
}

function bindList() {
  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { state.biz = t.dataset.biz; store.set('biz', state.biz); render(); });
  document.querySelectorAll('.card').forEach((c) => c.onclick = () => { state.open = c.dataset.id; render(); scrollTo(0, 0); });
  $('#refresh').onclick = () => load();

  document.querySelectorAll('[data-hist]').forEach((b) => b.onclick = () => { state.hist = b.dataset.hist; render(); scrollTo(0, 0); });
}

function bindReview(it) {
  $('#back').onclick = () => { state.open = null; render(); };
  $('#approve').onclick = () => {
    const draft = $('#draft').value;
    if (/\[[^\]]+\]/.test(draft)) {
      confirmSheet('Placeholders still in the draft', 'There\'s still text in [square brackets]. Send it anyway?', 'Send anyway', () => send(it, draft));
    } else {
      confirmSheet('Send this reply?', `It goes to ${it.from} from Brad@easybooksaccounting.com.`, 'Send', () => send(it, draft));
    }
  };
  $('#fyi').onclick = async () => {
    try { await api({ action: 'reject', status: 'FYI', id: it.id, business: it.business }); it.status = 'FYI'; it.actionedAt = new Date().toISOString(); state.open = null; render(); toast('Filed as FYI — no reply sent'); }
    catch { toast('Couldn\'t file it — try again'); }
  };
  $('#tobills').onclick = () => billsSheet(it, async () => {
    try { await api({ action: 'reject', status: 'FYI', id: it.id, business: it.business }); it.status = 'FYI'; it.actionedAt = new Date().toISOString(); } catch {}
    state.open = null; render();
  });
  $('#reject').onclick = () => confirmSheet('Reject this draft?', 'Nothing is sent to the client. The email stays in your inbox for you to handle.', 'Reject', async () => {
    try { await api({ action: 'reject', id: it.id, business: it.business }); it.status = 'Rejected'; it.actionedAt = new Date().toISOString(); state.open = null; render(); toast('Draft rejected — nothing was sent'); }
    catch { toast('Couldn\'t reject — try again'); }
  });
}

async function send(it, draft) {
  try {
    await api({ action: 'approve', id: it.id, business: it.business, draft });
    it.status = 'Sent'; it.actionedAt = new Date().toISOString(); it.draft = draft;
    state.open = null; render(); toast('Reply sent to ' + it.from);
  } catch { toast('Couldn\'t send — nothing went out. Try again.'); }
}

/* ---------- start ---------- */
// Auto-update: when a new version of the app is published, reload into it (no reinstall needed).
const APP_VERSION = '11';
async function checkUpdate() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const { v } = await r.json();
    if (v && v !== APP_VERSION && !state.open && !document.querySelector('.sheet')) {
      const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
      await Promise.all(regs.map((x) => x.update().catch(() => {})));
      location.reload();
    }
  } catch {}
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
setInterval(checkUpdate, 5 * 60e3);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && (state.demo || state.endpoint)) load(true); });
setInterval(() => { if (!document.hidden && !state.open && !state.files && !state.hist && !state.view && (state.demo || state.endpoint)) load(true); }, 60000);
if (state.demo || state.endpoint) load(); else render();
</script>
