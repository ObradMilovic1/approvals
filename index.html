<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Approvals</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Approvals">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFFFFF;--card:#FFFFFF;--ink:#0B0F0D;--body:#2A322E;--muted:#5A635F;--line:#E1E7E3;--soft:#F4F7F5;
    --acc:#00E187;--acc-d:#08804F;--acc-t:#DDFBEE;--on-acc:#0B0F0D;--red:#C4382D;--red-t:#FBEAE8;--amber:#9A5B00;--amber-t:#FFF1D9;
    --r:16px;--sh:0 1px 2px rgba(11,15,13,.04),0 10px 30px rgba(11,15,13,.06)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:Geist,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--paper) radial-gradient(60% 260px at 50% 0,rgba(0,225,135,.10),transparent 70%) no-repeat;background-attachment:fixed;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
  .wrap{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(170px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;min-height:100%}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--acc-d);outline-offset:2px}
  a{color:inherit}
  /* header + business switch */
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .bizsw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;min-width:0;box-shadow:var(--sh)}
  .bizsw button{border:none;background:none;height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .bizsw button .sw{width:8px;height:8px;border-radius:50%;flex:none}
  .bizsw button[aria-pressed=true]{background:var(--ink);color:#fff}
  .bizsw button[aria-pressed=true] .sw{box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .bizsw .n{font-size:12px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:999px;background:var(--soft);color:var(--ink);padding:0 5px}
  .bizsw button[aria-pressed=true] .n{background:var(--acc);color:var(--ink)}
  .hbtns{display:flex;gap:6px;flex:none}
  .iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none;color:var(--ink)}
  .iconbtn .pip{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
  .spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
  /* page titles */
  .hero{display:flex;flex-direction:column;gap:2px;padding:4px 2px 0}
  h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-1.4px;line-height:1.05}
  .brk{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:8px}
  mark{background:var(--acc);color:var(--ink);border-radius:7px;padding:1px 7px;font-weight:600}
  .lead{font-size:15px;color:var(--muted);line-height:1.4}
  .lead b{color:var(--ink);font-weight:600}
  .eyebrow{font-size:14px;color:var(--muted);font-weight:500}
  .top{display:flex;align-items:center;gap:10px;min-height:42px}
  .top .eyebrow{flex:1}
  /* summary strip */
  .stats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
  .stat{flex:none;display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-family:inherit}
  .stat .v{font-size:16px;font-weight:700}.stat .k{font-size:13px;color:var(--muted);font-weight:500}
  .stat.hot{background:var(--ink);border-color:var(--ink)}.stat.hot .v,.stat.hot .k{color:#fff}
  /* lists: one surface, rows divided */
  .list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
  .list>.card{touch-action:pan-y;transition:transform .18s ease}
  .swipebg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;background:var(--soft);color:var(--muted);font-size:14px;font-weight:600}
  .list>*+*{border-top:1px solid var(--line)}
  .card{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:none;border-radius:0;padding:14px 16px 14px 18px;cursor:pointer;width:100%;position:relative;font-size:inherit}
  .list>.card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
  .card:active{background:var(--soft)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .chip{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .who2{display:flex;align-items:center;gap:8px;min-width:0}
  .newtag{flex:none;font-size:11px;font-weight:700;background:var(--acc-t);color:var(--acc-d);border-radius:6px;padding:2px 7px}
  .time{font-size:13px;color:var(--muted);flex:none}
  .subj{font-size:16px;font-weight:600;line-height:1.3}
  .from{font-size:13px;color:var(--muted);word-break:break-all}
  .prev{font-size:14px;line-height:1.45;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
  .notice{background:var(--amber-t);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.4}
  .notice b{color:inherit}
  .sec{font-size:14px;font-weight:600;margin:6px 2px -6px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
  .sec span{font-weight:500;color:var(--muted)}
  .card.fyi{background:var(--card)}
  .list>.card.fyi::before{background:var(--line)}
  .fyitag{font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);border-radius:6px;padding:2px 8px;flex:none}
  .hint{font-size:13px;color:var(--muted);line-height:1.45;padding:0 2px}
  /* review */
  .rt{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0;line-height:1.25;word-break:break-word}
  .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
  .sendas{display:flex;align-items:center;gap:10px;background:var(--acc-t);color:var(--acc-d);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.35}
  .sendas b{color:var(--ink);font-weight:600;word-break:break-all}
  .sendas .sw{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none}
  details{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
  summary{font-size:14px;font-weight:600;cursor:pointer}
  details .orig{font-size:14px;color:var(--body);margin-top:8px;line-height:1.5;white-space:pre-wrap;max-height:40vh;overflow:auto}
  .lbl{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;padding:0 2px;margin-bottom:-8px}
  .lbl span{font-weight:500;color:var(--muted);margin-left:6px}
  .ph{font-size:12px;font-weight:700;background:var(--amber-t);color:var(--amber);border-radius:6px;padding:3px 8px}
  textarea{width:100%;min-height:42vh;resize:vertical;font-family:inherit;font-size:16px;line-height:1.55;color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--card);box-shadow:var(--sh)}
  textarea:focus{outline:none;border-color:var(--acc)}
  .orig.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;white-space:pre-wrap;line-height:1.55;font-size:15px}
  .actions{display:flex;gap:10px}
  .bar{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 75%,rgba(255,255,255,0));display:flex;gap:10px;z-index:4}
  .btn{height:52px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .btn.ok{flex:2;border:none;background:var(--ink);color:#fff}
  .btn.ok:active{background:#26302B}
  .btn.ok svg path{stroke:currentColor}
  .btn.rej,.btn.fyi{flex:1}
  .btn.danger{color:var(--red)}
  .btn:disabled,.btn[disabled]{opacity:.5}
  .menu{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:none;background:none;padding:14px 16px;text-align:left;font-size:16px;font-weight:600;cursor:pointer}
  .menu button+button{border-top:1px solid var(--line)}
  .menu small{font-size:13px;font-weight:500;color:var(--muted)}
  .menu .danger{color:var(--red)}
  /* sheet + toast + lock */
  .sheet{position:fixed;inset:0;background:rgba(11,15,13,.38);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet .box{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .sheet h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
  .sheet p{margin:0;color:var(--body);font-size:15px;line-height:1.5}
  .sheet .actions .btn{flex:1}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:500;z-index:30;display:flex;gap:10px;align-items:center;max-width:92vw;box-shadow:0 8px 24px rgba(30,42,38,.25)}
  .toast{width:max-content}.toast>span:not(.bar2){flex:1}
  .toast i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block;flex:none}
  .lock{display:flex;flex-direction:column;gap:14px;margin-top:10vh}
  .lock input{height:56px;border:1px solid var(--line);border-radius:14px;font-size:22px;text-align:center;font-family:inherit;background:var(--card)}
  .lock .btn{width:100%}
  .err{color:var(--red);font-size:14px;min-height:20px}
  .hidden{display:none!important}
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
  /* bottom nav */
  .nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:15;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(11,15,13,.10);padding:4px;max-width:520px;margin:0 auto}
  .nav .in{max-width:520px;margin:0 auto;display:flex}
  .nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0 4px;cursor:pointer;position:relative}
  .nav button svg *{stroke:currentColor}
  .nav button[aria-current=true]{color:var(--ink)}
  .nav .ic{width:48px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .nav button[aria-current=true] .ic{background:var(--acc-t)}
  .nav .dot{position:absolute;top:2px;left:calc(50% + 10px);min-width:17px;height:17px;border-radius:999px;background:var(--acc);color:var(--ink);font-size:10px;font-weight:700;line-height:17px;padding:0 5px;border:2px solid #fff;box-sizing:content-box}
  .nav .dot.red{background:var(--red);color:#fff}
  /* pipeline */
  .stages{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
  .stg,.hchip{flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--body)}
  .stg b{margin-left:6px;font-weight:600;color:var(--muted)}
  .stg[aria-pressed=true],.hchip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stg[aria-pressed=true] b{color:rgba(255,255,255,.7)}
  .hrow{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
  .lcard{display:flex;flex-direction:column;gap:4px;background:var(--card);padding:14px 16px}
  .links>.lcard{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .lcard .nm{font-size:16px;font-weight:600}
  .lcard .sub{font-size:13px;color:var(--muted);word-break:break-all}
  .lcard .note{font-size:14px;color:var(--body);line-height:1.45;white-space:pre-wrap}
  .lacts{display:flex;gap:8px;margin-top:6px}
  .lacts a,.lacts button{height:40px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;text-decoration:none;color:var(--ink);cursor:pointer}
  .lacts .go{flex:1;background:var(--acc-t);border-color:transparent;color:var(--acc-d)}
  .lacts .go svg *{stroke:currentColor}
  .src{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--muted);flex:none}
  .sug{display:flex;align-items:center;gap:8px;background:var(--card);padding:12px 12px 12px 16px}
  .sug .who{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sug .who small{display:block;font-weight:500;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
  .sug button{height:36px;border-radius:10px;border:none;background:var(--acc-t);color:var(--acc-d);font-size:13px;font-weight:700;padding:0 12px;cursor:pointer;flex:none}
  .sug button.x{background:none;color:var(--muted);padding:0 6px}
  .fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
  .fld input,.fld textarea,.fld select{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);min-height:0;box-shadow:none}
  .fld textarea{min-height:84px;resize:vertical}
  .stgpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stgpick button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer}
  .stgpick button[aria-pressed=true]{border-color:var(--acc);background:var(--acc-t);color:var(--acc-d)}
  .fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(156px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:16px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:26px;line-height:1;box-shadow:var(--sh);cursor:pointer;z-index:14}
  /* calls */
  .callrow{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 12px 12px 16px}
  .callrow .who{flex:1;min-width:0}
  .callrow .num{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .callrow .meta{margin-top:2px}
  .callbtn{width:46px;height:46px;border-radius:14px;background:var(--acc-t);display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
  .callbtn svg *{stroke:var(--acc-d)}
  .tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  .tag.miss{background:var(--red-t);color:var(--red)}.tag.newc{background:var(--acc-t);color:var(--acc-d)}.tag.out{background:var(--soft);color:var(--muted)}
  .namebtn{border:none;background:none;font-size:13px;font-weight:600;color:var(--acc-d);padding:0;cursor:pointer;margin-top:4px}
  /* inbox */
  .icard{display:flex;flex-direction:column;gap:3px;background:var(--card);padding:14px 16px}
  .ibtns{display:flex;gap:8px;margin-top:8px}
  .ibtns .btn{height:40px;font-size:14px;flex:1;border-radius:10px;padding:0 10px}
  .ibtns .btn.ok{flex:1.4}
  .mail{font-size:14px;line-height:1.45;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .unread .subj::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:8px;vertical-align:2px}
  .inapp{font-size:12px;font-weight:700;background:var(--acc-t);color:var(--acc-d);border-radius:6px;padding:3px 8px}
  /* history */
  .day{font-size:13px;font-weight:600;color:var(--muted);margin:8px 2px -8px}
  .st{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;flex:none}
  .st.Sent{background:var(--acc-t);color:var(--acc-d)}.st.FYI{background:var(--soft);color:var(--muted)}.st.Rejected{background:var(--red-t);color:var(--red)}.st.Waiting{background:var(--amber-t);color:var(--amber)}.st.Approved{background:var(--acc-t);color:var(--acc-d)}
  .links{display:flex;flex-direction:column;gap:10px}
  .link{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);padding:14px 16px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:600}
  .links>.link{border:1px solid var(--line);border-radius:var(--r)}
  .link small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
  .folder{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--acc-d);text-decoration:none}
  .folder svg *{stroke:currentColor}
  /* chat */
  .askfab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(96px + env(safe-area-inset-bottom));z-index:15;height:48px;padding:0 16px 0 14px;border:none;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;box-shadow:0 8px 22px rgba(11,15,13,.28);cursor:pointer;display:flex;align-items:center;gap:8px}
  .askfab span{color:var(--acc);font-size:18px}
  .chead{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);margin:calc(-12px - env(safe-area-inset-top)) -16px 0;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
  .ctitle{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
  .cstar{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
  .cstar.sm{width:28px;height:28px;border-radius:8px;font-size:14px}
  .cclear{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .chat{display:flex;flex-direction:column;gap:12px;padding-bottom:110px}
  .cempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:36px 4px 0;color:var(--muted)}
  .cempty b{font-size:19px;color:var(--ink)}
  .cideas{display:flex;flex-direction:column;width:100%;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .cideas button{border:none;background:none;padding:14px 16px;font:inherit;font-size:15px;text-align:left;cursor:pointer;color:var(--ink)}
  .cideas button+button{border-top:1px solid var(--line)}
  .cb{max-width:88%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere}
  .cb.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
  .cb.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .cb.ai p{margin:0 0 8px}.cb.ai p:last-of-type{margin-bottom:0}

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decryptEndpoint(pass) {
  const { salt, iv, data } = CONFIG.ENDPOINT_ENC;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(salt), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

  return new TextDecoder().decode(plain);

// Age of a waiting email, so nothing sits too long.
function ageTag(it) {
  const h = (Date.now() - new Date(it.receivedAt)) / 36e5;
  if (!(h >= 4)) return '';
  const txt = h < 24 ? `${Math.floor(h)}h` : `${Math.floor(h / 24)} day${h >= 48 ? 's' : ''}`;
  return `<span class="age ${h >= 24 ? 'old' : ''}">Waiting ${txt}</span>`;
}
// Your week: replies handled per day, streak and how fast clients hear back.
function weekCard() {
  const done = state.items.filter((i) => (i.status === 'Sent' || i.status === 'FYI') && i.actionedAt);
  const days = Array.from({ length: 7 }, (_, k) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (6 - k)); return d; });
  const counts = days.map((d) => done.filter((i) => new Date(i.actionedAt).toDateString() === d.toDateString()).length);
  const total = counts.reduce((a, b) => a + b, 0);
  let streak = 0; for (let k = 6; k >= 0; k--) { if (counts[k]) streak++; else if (k === 6) continue; else break; }
  const times = done.filter((i) => i.status === 'Sent' && Date.now() - new Date(i.actionedAt) < 7 * 864e5).map((i) => (new Date(i.actionedAt) - new Date(i.receivedAt)) / 6e4).filter((m) => m >= 0).sort((a, b) => a - b);
  const med = times.length ? times[Math.floor(times.length / 2)] : null;
  const fmt = (m) => m < 60 ? `${Math.round(m)} min` : m < 1440 ? `${(m / 60).toFixed(m < 600 ? 1 : 0)} h` : `${(m / 1440).toFixed(1)} days`;
  const max = Math.max(1, ...counts);
  const bars = days.map((d, k) => `<div><i class="${counts[k] ? '' : 'z'}" style="height:${Math.max(3, Math.round(counts[k] / max * 48))}px;animation-delay:${k * 50}ms" title="${counts[k]}"></i>${'SMTWTFS'[d.getDay()]}</div>`).join('');
  return `<div class="week"><div class="wt">${streak > 1 ? `<span class="streak"><span>●</span> ${streak}-day streak</span>` : ''}<span class="big">${total}</span><small>emails handled this week${med !== null ? `<br>Clients hear back in about <b>${fmt(med)}</b>` : ''}</small></div><div class="wbars" aria-label="Emails handled each day this week">${bars}</div></div>`;
}

  ['Director ID evidence', 'Signed consent to act as director', 'Shareholder details'],

const leadReqs = (l) => getTag(l.Notes, 'Req').split(';').map((x) => x.trim()).filter(Boolean);

function portalChips(l) {
  const out = [], todo = getTag(l.Notes, 'Todo'), ch = getTag(l.Notes, 'Chased').split('|')[0];
  if (ch === '2') out.push('<span class="warn">Reminded twice: call them</span>'); else if (ch === '1') out.push('<span>Reminder sent</span>');
  if (todo === '0') out.push('<span class="ok">Portal complete</span>'); else if (todo) out.push(`<span>${esc(todo)} portal item${todo === '1' ? '' : 's'} open</span>`);
  const r = leadReqs(l).length; if (r) out.push(`<span>${r} requested</span>`);

function requestSheet(l) {

  };

    <h2>Request documents</h2>

    <div class="actions" style="position:static"><button class="btn rej" data-x>Cancel</button><button class="btn ok" data-send>Request</button></div></div>`;

    const body = `Hi${first ? ' ' + first : ''},\n\nTo keep things moving, could you please send us:\n\n${list}\n\n${msg ? msg + '\n\n' : ''}${PORTAL_ON ? `You can upload them in your secure client portal. We'll text a code to your mobile to let you in:\n${portalLink(l)}` : 'You can reply to this email with them attached, or send photos.'}\n\nThank you.\n\nKind regards,\n${me}`;

      if (PORTAL_ON && isMobile(l.Phone)) { try { await api({ action: 'sms', to: ausNum(l.Phone), text: `Hi ${first || 'there'}, ${me} here. We've asked for ${fresh.length || items.length} document${(fresh.length || items.length) > 1 ? 's' : ''} in your client portal: ${portalLink(l)}` }); } catch { toast('Email sent, but the text didn\'t go'); } }

/* Books health: weekly check of every client's Xero file */
const HEALTH_DAYS = 7;
function healthIssues(c) {
  const out = [], nm = c.suspNames || [], nv = c.suspVals || [];
  nm.forEach((n, i) => {
    const v = Number(nv[i]) || 0; if (Math.abs(v) < 0.5) return;
    if (/historical adjustment/i.test(n)) out.push({ lvl: 'amber', t: `Historical Adjustment holds ${money(Math.abs(v))}`, s: 'Opening balances were never finished. Clear it with a journal once the conversion figures are confirmed.' });
    else if (/clearing/i.test(n)) out.push({ lvl: 'amber', t: `${n} is ${money(v)}, not zero`, s: 'Payouts and fees haven\'t all been matched. Check the platform payouts against the bank.' });
    else out.push({ lvl: 'red', t: `${n} holds ${money(Math.abs(v))}`, s: 'Transactions coded here still need a real account. Recode them before the next BAS.' });
  });
  (c.negNames || []).forEach((n, i) => out.push({ lvl: 'red', t: `${n} is overdrawn by ${money(Math.abs(Number(c.negVals[i]) || 0))}`, s: /till|cash|petty/i.test(n) ? 'A cash account can\'t go below zero. Some cash takings are missing or expenses were double counted.' : 'Check the statement balance matches Xero, then look for missing deposits.' }));
  if (c.oldDrafts) out.push({ lvl: 'amber', t: `${c.oldDrafts} draft bill${c.oldDrafts === 1 ? '' : 's'} older than 2 weeks`, s: 'Approve them or delete them so payables are right.' });
  if (c.apOver30) out.push({ lvl: 'amber', t: `${c.apOver30} bill${c.apOver30 === 1 ? '' : 's'} 30+ days overdue, ${money(c.apOver30Amt)}`, s: 'Either they\'re paid and need matching to the bank, or the supplier is waiting.' });
  if (c.arOver60) out.push({ lvl: c.arOver60Amt >= 10000 ? 'red' : 'amber', t: `${c.arOver60} invoice${c.arOver60 === 1 ? '' : 's'} 60+ days overdue, ${money(c.arOver60Amt)}`, s: 'Chase them, or if they\'re already paid, match the payments in Xero.' });
  return out.sort((a, b) => (a.lvl === 'red' ? 0 : 1) - (b.lvl === 'red' ? 0 : 1));
}
function healthList() {
  if (!state.health) return [];
  return state.health.list.map((c) => { const issues = healthIssues(c); const r = issues.filter((i) => i.lvl === 'red').length, a = issues.length - r; return { ...c, issues, score: Math.max(0, 100 - r * 20 - a * 8) }; }).sort((a, b) => a.score - b.score || a.name.localeCompare(b.name));

/* ---------- Xero bills: forward supplier emails to a client's Xero bills inbox ---------- */
let BILLS_BASE = null;
async function billsBase() {
  if (BILLS_BASE) return BILLS_BASE;
  if (state.demo || !CONFIG.BILLS_ENC) return (BILLS_BASE = { 'Avalon Village Meats': 'bills.demo@xerofiles.com' });
  try {
    const { salt, iv, data } = CONFIG.BILLS_ENC;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(state.endpoint), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(salt), iterations: 100000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    BILLS_BASE = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(iv) }, key, b64(data))));
  } catch { BILLS_BASE = {}; }
  return BILLS_BASE;
}
const myBills = () => { try { return JSON.parse(store.get('bills') || '{}'); } catch { return {}; } };
const supplierMap = () => { try { return JSON.parse(store.get('supplierClient') || '{}'); } catch { return {}; } };

const fmtChat = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function mdChat(t) {
  const lines = esc(t).split('\n'); let out = '', list = '';
  const inline = (x) => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  for (const raw of lines) {
    const l = raw.trim(); const li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (li) { list += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { out += `<ul>${list}</ul>`; list = ''; }
    if (!l) continue;
    const h = l.match(/^#{1,4}\s+(.*)$/);
    out += h ? `<h4>${inline(h[1])}</h4>` : /^\*\*[^*]+\*\*:?$/.test(l) ? `<h4>${inline(l.replace(/:$/, ''))}</h4>` : `<p>${inline(l)}</p>`;
  }
  if (list) out += `<ul>${list}</ul>`;
  return out;
}
const CHAT_IDEAS = ['What\'s waiting on me today?', 'Who owes the most in Xero?', 'Draft a BAS reminder email', 'Summarise my new leads'];
function viewChat() {
  const log = chatLog();
  const bubbles = log.map((m, i) => m.role === 'user' ? `<div class="cb me">${esc(m.content).replace(/\n/g, '<br>')}</div>`
    : `<div class="cb ai">${mdChat(m.content)}<button class="ccopy" data-copy="${i}">Copy</button></div>`).join('');
  const empty = `<div class="cempty"><div class="cstar">✦</div><b>Ask Claude</b><span>It can see your approvals, inbox, leads, calls and Xero figures.</span>
    <div class="cideas">${CHAT_IDEAS.map((q) => `<button data-idea="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`;
  return `<div class="chead"><button class="iconbtn" id="back" aria-label="Back">${I.back}</button><div class="ctitle"><span class="cstar sm">✦</span> Ask Claude</div>${log.length ? '<button class="cclear" id="clear">New chat</button>' : '<span style="width:44px"></span>'}</div>
    <div class="chat" id="chat">${bubbles || empty}${state.chatBusy ? '<div class="cb ai typing"><span></span><span></span><span></span></div>' : ''}</div>
    <div class="cin"><textarea id="q" rows="1" placeholder="Message Claude…"></textarea><button class="csend" id="ask" aria-label="Send" ${state.chatBusy ? 'disabled' : ''}>${I.send}</button></div>`;
}
function bindChat() {
  $('#back').onclick = () => { state.view = null; render(); };
  const c = $('#clear'); if (c) c.onclick = () => { chatSave([]); render(); };
  const q = $('#q'); window.scrollTo(0, document.body.scrollHeight);
  q.oninput = () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; };
  const go = async () => {
    const text = q.value.trim(); if (!text || state.chatBusy) return;
    const log = chatLog(); log.push({ role: 'user', content: text }); chatSave(log); q.value = '';
    state.chatBusy = true; render();
    try {
      const r = state.demo ? { answer: 'This is the demo. In the live app I answer using your real emails, leads and Xero figures.' } : await api({ action: 'ask', messages: log.slice(-12), context: chatContext() });
      const a = (r && r.answer) || 'Sorry, I didn\'t get an answer back. Try again in a moment.';
      const l2 = chatLog(); l2.push({ role: 'assistant', content: a }); chatSave(l2);
    } catch { const l2 = chatLog(); l2.push({ role: 'assistant', content: 'I couldn\'t connect just now. Check your signal and try again.' }); chatSave(l2); }
    state.chatBusy = false; if (state.view === 'chat') render();
  };
  $('#ask').onclick = go;
  document.querySelectorAll('[data-idea]').forEach((b) => b.onclick = () => { q.value = b.dataset.idea; go(); });
  document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = async () => { try { await navigator.clipboard.writeText(chatLog()[+b.dataset.copy].content); toast('Copied'); } catch { toast('Couldn\'t copy'); } });
  q.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } };
  if (!state.chatBusy) q.focus();
}

/* ---------- render + events ---------- */
function renderNav(show) {
  let n = document.getElementById('nav');
  if (!show) { if (n) n.remove(); const f = document.getElementById('fab'); if (f) f.remove(); return; }
  if (!n) { n = document.createElement('nav'); n.id = 'nav'; n.className = 'nav'; document.body.appendChild(n); }
  const cur = state.view || 'home';
  const nIn = inboxOpen().length, nMiss = missedToday().length, nW = waiting(state.biz).length, nSug = (() => { const b = state.biz; let t = 0; for (const x of CONFIG.BUSINESSES) { state.biz = x.id; t += suggestions().length; } state.biz = b; return t; })();
  const tab = (k, label, icon, badge, red) => `<button data-nav="${k}" aria-current="${cur === k}"><span class="ic">${icon}</span>${label}${badge ? `<span class="dot ${red ? 'red' : ''}">${badge}</span>` : ''}</button>`;
  n.innerHTML = `<div class="in">${tab('home', 'Approvals', I.check, nW)}${tab('inbox', 'Inbox', I.mail, nIn)}${tab('calls', 'Calls', I.phone, nMiss, true)}${tab('pipeline', 'Pipeline', I.board, nSug)}${tab('clients', 'Xero', I.xero, (state.xero ? state.xero.list.filter((c) => c.overdue > 0).length : 0), true)}</div>`;
  let fab = document.getElementById('fab');
  if (!fab) { fab = document.createElement('button'); fab.id = 'fab'; fab.className = 'askfab'; fab.setAttribute('aria-label', 'Ask Claude'); fab.innerHTML = '<span>✦</span>Ask Claude'; document.body.appendChild(fab); }
  fab.onclick = () => { state.open = null; state.hist = null; state.files = false; state.view = 'chat'; render(); };
  n.querySelectorAll('[data-nav]').forEach((b) => b.onclick = () => {
    const k = b.dataset.nav; state.open = null; state.hist = null; state.files = k === 'files'; state.view = (k === 'home' || k === 'files') ? null : k; render(); scrollTo(0, 0);
  });
}

function render() {
  const app = $('#app');
  const openIt = state.open && state.items.find((i) => i.id === state.open);
  document.body.dataset.biz = openIt ? openIt.business : (state.view === 'calls' ? CALLS_BIZ : state.biz);
  const key = [state.view, state.open, state.hist, state.files, state.biz].join('|');
  renderView();
  if (key !== state.lastKey) { app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); state.lastKey = key; }
  if (!state.loading || state.items.length) { const sp = document.getElementById('splash'); if (sp && !sp.dataset.t) { sp.dataset.t = 1; setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 400); }, Math.max(0, 1100 - performance.now())); } }
  if ($('mark.sweep') && !state.sweepT) state.sweepT = setTimeout(() => { state.swept = true; }, 2600);
  document.querySelectorAll('[data-sw]').forEach((b) => b.onclick = () => { state.biz = b.dataset.sw; store.set('biz', state.biz); render(); });
}
function renderView() {
  const app = $('#app');
  if (!state.demo && !state.endpoint) { renderNav(false); app.innerHTML = viewLock(); bindLock(); return; }
  renderNav(!state.open);
  const it = state.open && state.items.find((i) => i.id === state.open);
  const back = () => { state.open = null; render(); };
  if (state.view === 'inbox' && !it) { app.innerHTML = viewInbox(); bindInbox(); return; }
  if (state.view === 'calls' && !it) { app.innerHTML = viewCalls(); bindCalls(); return; }
  if (state.view === 'pipeline' && !it) { app.innerHTML = viewPipeline(); bindPipeline(); return; }
  if (state.view === 'clients' && !it) { app.innerHTML = viewClients(); bindClients(); return; }
  if (state.view === 'chat' && !it) { const old = $('#q') ? $('#q').value : ''; renderNav(false); app.innerHTML = viewChat(); if (old) $('#q').value = old; bindChat(); return; }
  if (it && (it.status === 'Sent' || it.status === 'Rejected' || it.status === 'Approved')) { app.innerHTML = viewDone(it); $('#back').onclick = back; const r = $('#reopen'); if (r) r.onclick = () => { it.status = 'Waiting'; render(); }; return; }
  if (state.hist && !it) { app.innerHTML = viewHistory(); $('#back').onclick = () => { state.hist = null; render(); };
    document.querySelectorAll('.hchip').forEach((c) => c.onclick = () => { state.hist = c.dataset.f; render(); });
    document.querySelectorAll('.card').forEach((c) => c.onclick = () => { state.open = c.dataset.id; render(); scrollTo(0, 0); }); return; }
  if (state.files && !it) { app.innerHTML = viewFiles(); $('#back').onclick = () => { state.files = false; render(); }; return; }
  if (it && it.status === 'FYI') { app.innerHTML = viewFyi(it); $('#back').onclick = () => { state.open = null; render(); }; $('#reopen').onclick = () => { it.status = 'Waiting'; render(); }; return; }
  app.innerHTML = it ? viewReview(it) : viewList();
  it ? bindReview(it) : bindList();
}

function bindLock() {
  const go = async () => {
    const p = $('#pass').value.trim().toLowerCase(); if (!p) return;
    $('#err').textContent = 'Checking…';
    try { state.endpoint = await decryptEndpoint(p); store.set('endpoint', state.endpoint); load(); }
    catch { $('#err').textContent = 'That passcode isn\'t right. Try again.'; }
  };
  $('#unlock').onclick = go; $('#pass').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  $('#pass').focus();
}

function bindList() {
  document.querySelectorAll('.card').forEach((c) => c.onclick = () => { if (c.dataset.swiped) return; state.open = c.dataset.id; render(); scrollTo(0, 0); });
  document.querySelectorAll('.list>.card:not(.fyi)').forEach(swipeable);
  document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { state.view = b.dataset.go; render(); scrollTo(0, 0); });
  $('#brief').onclick = briefSheet;
  const sr = $('#startrun'); if (sr) sr.onclick = () => { const w = waiting(state.biz); state.open = w[0].id; render(); scrollTo(0, 0); };
  $('#refresh').onclick = () => load();
  $('#files').onclick = () => { state.files = true; render(); scrollTo(0, 0); };
  document.querySelectorAll('[data-hist]').forEach((b) => b.onclick = () => { state.hist = b.dataset.hist; render(); scrollTo(0, 0); });
}

// Swipe a card left to file it as FYI (with undo).
function swipeable(c, onSwipe) {
  let x0 = null, y0 = 0, dx = 0, lock = null;
  c.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; lock = null; c.style.transition = 'none'; }, { passive: true });
  c.addEventListener('touchmove', (e) => {
    if (x0 === null) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (lock === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    if (lock !== 'x') return;
    dx = Math.min(0, mx); c.style.transform = `translateX(${dx}px)`;
    if (!c.previousElementSibling || !c.previousElementSibling.classList || !c.querySelector('.swipebg')) {}
  }, { passive: true });
  c.addEventListener('touchend', () => {
    c.style.transition = '';
    if (lock === 'x' && dx < -110) {
      c.dataset.swiped = '1'; c.style.transform = 'translateX(-110%)';
      if (onSwipe) setTimeout(onSwipe, 160);
      else { const it = state.items.find((i) => i.id === c.dataset.id); setTimeout(() => it && fyiWithUndo(it, false), 160); }
    } else { c.style.transform = ''; if (lock === 'x' && dx < -8) { c.dataset.swiped = '1'; setTimeout(() => delete c.dataset.swiped, 50); } }
    x0 = null;
  });
}

function bindReview(it) {
  $('#back').onclick = () => { state.open = null; render(); };
  $('#approve').onclick = () => {
    const draft = $('#draft').value;
    if (/\[[^\]]+\]/.test(draft)) {
      confirmSheet('Some blanks aren\'t filled in', 'The draft still has text in [square brackets]. Send it anyway?', 'Send anyway', () => send(it, draft));
    } else {
      send(it, draft);
    }
  };
  $('#tweak').onclick = async (e) => {
    const b = e.target.closest('[data-tw]'); if (!b) return;
    const box = $('#tweak'), ta = $('#draft'), before = ta.value, how = TWEAKS[+b.dataset.tw][1];
    box.setAttribute('aria-busy', 'true'); const label = b.innerHTML; b.textContent = 'Rewriting…';
    try {
      const r = await api({ action: 'ask', context: '', messages: [{ role: 'user', content: `Rewrite this email reply so it is ${how}. Keep every fact, amount and date, keep anything in [square brackets] as it is, write in Australian English, do not add a greeting change, sign-off or signature, and reply with only the new email text, nothing else.\n---\n${before}` }] });
      const out = String(r.answer || '').trim();
      if (!out) throw new Error('empty');
      ta.value = out; it.draft = out;
      undoToast('Draft rewritten', 6000, () => {}, () => { ta.value = before; it.draft = before; });
    } catch { toast('Claude couldn\'t rewrite it just now. Try again.'); }
    box.removeAttribute('aria-busy'); b.innerHTML = label;
  };
  $('#draft').oninput = () => { it.draft = $('#draft').value; };
  const fileFyi = async () => {
    fyiWithUndo(it, true);
  };
  const reject = () => confirmSheet('Reject this draft?', 'Nothing is sent to the client. The email stays in the inbox for you to handle yourself.', 'Reject draft', async () => {
    try { await api({ action: 'reject', id: it.id, business: it.business }); it.status = 'Rejected'; it.actionedAt = new Date().toISOString(); state.open = null; render(); toast('Draft rejected, nothing sent'); }
    catch { toast('Couldn\'t reject it. Try again.'); }
  });
  const toBills = () => billsSheet(it, async () => {
    try { await api({ action: 'reject', status: 'FYI', id: it.id, business: it.business }); it.status = 'FYI'; it.actionedAt = new Date().toISOString(); } catch {}
    state.open = null; render();
  });
  $('#more').onclick = () => {
    const s = document.createElement('div'); s.className = 'sheet';
    s.innerHTML = `<div class="box"><h2>Other options</h2><div class="menu">
      <button data-a="fyi">File as FYI<small>No reply needed. Keeps a record in History.</small></button>
      <button data-a="bills">Send to Xero bills<small>Forwards it to a client's Xero as a draft bill.</small></button>
      <button data-a="reject" class="danger">Reject draft<small>Nothing is sent. Handle the email yourself.</small></button></div>
      <button class="btn" data-x>Cancel</button></div>`;
    s.addEventListener('click', (e) => {
      if (e.target === s || e.target.closest('[data-x]')) return s.remove();
      const a = e.target.closest('[data-a]'); if (!a) return; s.remove();
      ({ fyi: fileFyi, bills: toBills, reject })[a.dataset.a]();
    });
    document.body.appendChild(s);
  };
}

// Send with a 6 second undo, then open the next reply straight away.
function send(it, draft) {
  buzz();
  it.draft = draft; it.status = 'Sending'; it.actionedAt = new Date().toISOString();
  const nx = nextWaiting(it); state.open = nx ? nx.id : null; if (!nx) state.celebrate = true; state.pending.add(it.id); render(); scrollTo(0, 0);
  undoToast('Sending to ' + it.from, 6000, async () => {
    state.pending.delete(it.id);
    try { await api({ action: 'approve', id: it.id, business: it.business, draft }); it.status = 'Sent'; const m = state.inbox.find((x) => x.id === it.id); if (m) m.read = true; render(); }
    catch { it.status = 'Waiting'; render(); toast('Couldn\'t send the reply to ' + it.from + '. Nothing went out, it\'s back in Approvals.'); }
  }, () => { state.pending.delete(it.id); state.celebrate = false; it.status = 'Waiting'; state.open = it.id; render(); scrollTo(0, 0); });
}
function fyiWithUndo(it, advance) {
  buzz();
  it.status = 'FYI'; it.actionedAt = new Date().toISOString();
  if (advance) { const nx = nextWaiting(it); state.open = nx ? nx.id : null; }
  if (!waiting(it.business).length) state.celebrate = true;
  state.pending.add(it.id); render();
  undoToast('Filed as FYI, no reply sent', 5000, async () => {
    state.pending.delete(it.id);
    try { await api({ action: 'reject', status: 'FYI', id: it.id, business: it.business }); const m = state.inbox.find((x) => x.id === it.id); if (m) { m.read = true; render(); } }
    catch { it.status = 'Waiting'; render(); toast('Couldn\'t file it. It\'s back in Approvals.'); }
  }, () => { state.pending.delete(it.id); state.celebrate = false; it.status = 'Waiting'; render(); });
}

/* ---------- start ---------- */
// Auto-update: when a new version of the app is published, reload into it (no reinstall needed).
const APP_VERSION = '29';
async function checkUpdate() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const { v } = await r.json();
    if (v && v !== APP_VERSION && !state.open && !document.querySelector('.sheet')) {
      const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
      await Promise.all(regs.map((x) => x.update().catch(() => {})));
      location.reload();
    }
  } catch {}
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
setInterval(checkUpdate, 5 * 60e3);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden && (state.demo || state.endpoint)) load(true); });
setInterval(() => { if (!document.hidden && !state.open && !state.files && !state.hist && !state.view && (state.demo || state.endpoint)) load(true); }, 60000);
if (state.demo || state.endpoint) load(); else render();
// Weekly books health check: runs itself in the background once a week.
setTimeout(() => { if ((state.demo || state.endpoint) && healthStale() && !state.healthLoading) loadHealth(); }, 8000);
</script>
