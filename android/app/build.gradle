plugins {
    id 'com.android.application'
}

android {
    namespace 'au.com.easybooks.approvals'
    compileSdk 34

    defaultConfig {
        applicationId 'au.com.easybooks.approvals'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly on your phone.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
